appId: dev.daut.greenroom
productName: Greenroom
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Stable names so install.sh can use releases/latest/download/<name>.
artifactName: greenroom-${os}-${arch}.${ext}

mac:
  category: public.app-category.education
  target:
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
  # Unsigned for now: ad-hoc signature so Apple Silicon will run it.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Greenroom listens to your answers during practice sessions.

linux:
  category: Education
  target: [AppImage, deb]
  maintainer: daut
  synopsis: Personal interview and presentation trainer

deb:
  depends: [libnotify4, libxtst6, libnss3]

publish:
  provider: github
  owner: daut
  repo: greenroom
